<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f6f9;
    }

    .sidebar {
      height: 100vh;
      background-color: #212529;
      color: white;
      padding-top: 20px;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      display: block;
      padding: 10px;
      border-radius: 5px;
    }

    .sidebar a:hover {
      background-color: #495057;
    }

    .card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .topbar {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-md-2 sidebar">
      <h3 class="text-center">Dashboard</h3>
      <a href="#">Home</a>
      <a href="#">Students</a>
      <a href="#">Exams</a>
      <a href="#">Results</a>
      <a href="#">Settings</a>
    </div>

    <!-- Main Content -->
    <div class="col-md-10 p-4">

      <!-- Topbar -->
      <div class="topbar">
        <h2>College Admin Dashboard</h2>
      </div>

      <!-- Statistics Cards -->
      <div class="row g-4">

        <div class="col-md-3">
          <div class="card bg-primary text-white p-3">
            <h4>Total Students</h4>
            <h2>1200</h2>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card bg-success text-white p-3">
            <h4>Total Exams</h4>
            <h2>45</h2>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card bg-warning text-dark p-3">
            <h4>Faculty</h4>
            <h2>80</h2>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card bg-danger text-white p-3">
            <h4>Results Published</h4>
            <h2>30</h2>
          </div>
        </div>

      </div>

    </div>

  </div>
</div>

</body>
</html>
